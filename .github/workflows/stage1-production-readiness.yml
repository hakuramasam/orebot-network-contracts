name: Stage 1 - Production Readiness

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, 'feat/**']

permissions:
  contents: read

jobs:
  openapi:
    name: OpenAPI validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Lint OREBOT OpenAPI contract
        run: npx --yes @redocly/cli@latest lint docs/openapi/orebot-gateway.yaml

  solidity:
    name: Foundry tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts
        run: forge build --sizes
      - name: Run contract tests
        run: forge test -vv

  agent-sdk:
    name: Agent SDK build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install SDK dependencies
        run: npm install --no-audit --no-fund
      - name: Build SDK
        run: npm run build

  gateway:
    name: Gateway install and dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/x402-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gateway dependencies
        run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  root-dependencies:
    name: Root dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked root dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  readiness:
    name: Production readiness gate
    runs-on: ubuntu-latest
    needs: [openapi, solidity, agent-sdk, gateway, root-dependencies]
    steps:
      - name: Stage 1 passed
        run: echo "OpenAPI, Solidity, SDK, gateway, and dependency checks passed."
