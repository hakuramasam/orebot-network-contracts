[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.24"
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "@safe/=lib/safe-contracts/contracts/"]

[profile.safe]
solc = "0.8.23"
via_ir = true
optimizer = true
optimizer_runs = 200
out = "out-safe"
src = "safe-src"
script = "safe-scripts"
test = "safe-tests"
